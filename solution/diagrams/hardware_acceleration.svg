<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 8px; ry: 8px; stroke-width: 2px; }
      .header-box { fill: #0f172a; stroke: #1e293b; }
      .path-bad { fill: #fff1f2; stroke: #f43f5e; }
      .path-good { fill: #f0fdf4; stroke: #10b981; }
      .component { fill: #ffffff; stroke: #64748b; stroke-width: 1.5px; rx: 6px; ry: 6px; }
      .gpu-card { fill: #1e293b; stroke: #22c55e; stroke-width: 2px; rx: 6px; ry: 6px; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .col-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; }
      .text-head { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .text-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .text-metric { font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold; }
      .text-gpu { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #4ade80; }
      .text-gpu-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .arrow-bad { stroke: #f43f5e; stroke-width: 2px; fill: none; marker-end: url(#arrow-red); }
      .arrow-good { stroke: #10b981; stroke-width: 2px; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow-red" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f43f5e" />
    </marker>
    <marker id="arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#10b981" />
    </marker>
  </defs>

  <!-- Banner -->
  <rect x="20" y="20" width="980" height="55" class="box header-box" />
  <text x="40" y="45" class="title">Video path: renderer and ffmpeg</text>
  <text x="40" y="63" class="subtitle">Physics stays implicitfast at dt = 0.004 s. Encoding follows whatever ffmpeg lists.</text>

  <!-- LEFT: WSL EGL setup -->
  <rect x="30" y="95" width="455" height="440" class="box path-bad" />
  <text x="50" y="125" class="col-title" fill="#be123c">WSL EGL setup in gl_backend.py</text>
  <text x="50" y="145" class="text-desc">Environment: MUJOCO_GL=egl | GALLIUM_DRIVER=d3d12</text>

  <!-- Box 1A: MuJoCo Physics -->
  <rect x="50" y="165" width="415" height="50" class="component" />
  <text x="65" y="185" class="text-head">MuJoCo Physics Step</text>
  <text x="65" y="202" class="text-desc">dt = 0.004 s, integrator implicitfast</text>

  <path d="M 255 215 L 255 240" class="arrow-bad" />

  <!-- Box 1B: GPU Render Call -->
  <rect x="50" y="245" width="415" height="55" class="component" />
  <text x="65" y="265" class="text-head">Mesa D3D12 EGL Offscreen Buffer</text>
  <text x="65" y="285" class="text-desc">OpenGL-on-DirectX12 translation layer</text>

  <path d="M 255 300 L 255 325" class="arrow-bad" />

  <!-- Box 1C: Bottleneck glReadPixels -->
  <rect x="50" y="330" width="415" height="70" style="fill: #fee2e2; stroke: #e11d48; stroke-width: 2px; rx: 6px;" />
  <text x="65" y="352" class="text-head" fill="#be123c">Readback is whatever MuJoCo's EGL context does</text>
  <text x="65" y="370" class="text-desc">The repo does not record a frame time for this path.</text>
  <text x="65" y="388" class="text-metric" fill="#b91c1c">No frame-time constant is stored in the controller</text>

  <path d="M 255 400 L 255 425" class="arrow-bad" />

  <!-- Box 1D: FFmpeg Software Encode -->
  <rect x="50" y="430" width="415" height="55" class="component" />
  <text x="65" y="450" class="text-head">Same ffmpeg writer as the other column</text>
  <text x="65" y="470" class="text-desc">libx264 is the fallback when h264_nvenc is absent</text>


  <!-- RIGHT: --video writer -->
  <rect x="535" y="95" width="465" height="440" class="box path-good" />
  <text x="555" y="125" class="col-title" fill="#047857">Path used when --video is set</text>
  <text x="555" y="145" class="text-desc">Renderer follows MUJOCO_GL. Encoder follows ffmpeg -encoders</text>

  <!-- Box 2A: MuJoCo Physics -->
  <rect x="555" y="165" width="425" height="50" class="component" />
  <text x="570" y="185" class="text-head">MuJoCo Physics Step</text>
  <text x="570" y="202" class="text-desc">dt = 0.004 s, integrator implicitfast</text>

  <path d="M 765 215 L 765 240" class="arrow-good" />

  <!-- Box 2B: OSMesa CPU SIMD Render -->
  <rect x="555" y="245" width="425" height="70" class="component" style="border-color: #10b981;" />
  <text x="570" y="267" class="text-head" fill="#047857">MuJoCo offscreen framebuffer</text>
  <text x="570" y="285" class="text-desc">Backend is whatever MUJOCO_GL selected.</text>
  <text x="570" y="303" class="text-metric" fill="#047857">1920x1080 raw RGB. No millisecond figure in the code</text>

  <path d="M 765 315 L 765 340" class="arrow-good" />

  <!-- Box 2C: Zero-Copy Raw Pipe -->
  <rect x="555" y="345" width="425" height="50" class="component" />
  <text x="570" y="365" class="text-head">rawvideo rgb24 on ffmpeg stdin</text>
  <text x="570" y="382" class="text-desc">Mosaic and per-camera files are 1920x1080</text>

  <path d="M 765 395 L 765 420" class="arrow-good" />

  <!-- Box 2D: Hardware NVENC GPU -->
  <rect x="555" y="425" width="425" height="85" class="gpu-card" />
  <text x="570" y="450" class="text-gpu">ffmpeg encoder selection</text>
  <text x="570" y="470" class="text-gpu-sub">h264_nvenc preset p1 tune ull, if that encoder is listed</text>
  <text x="570" y="490" class="text-metric" fill="#4ade80">Otherwise libx264 ultrafast. Frames are 1920x1080</text>
</svg>
