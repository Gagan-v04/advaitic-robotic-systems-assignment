<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 620" width="100%" height="100%">
  <defs>
    <style>
      .box { rx: 6px; ry: 6px; stroke-width: 1.5px; }
      .stage-card { fill: #f8fafc; stroke: #3b82f6; }
      .stage-critical { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2px; }
      .stage-num { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: bold; fill: #2563eb; }
      .stage-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: bold; fill: #0f172a; }
      .stage-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .stage-metric { font-family: 'Consolas', monospace; font-size: 10px; fill: #0284c7; }
      .title-box { fill: #0f172a; stroke: #1e293b; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .connector { stroke: #64748b; stroke-width: 2px; fill: none; marker-end: url(#arrow); }
      .flow-note { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#64748b" />
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="20" y="20" width="1020" height="55" rx="8" class="title-box" />
  <text x="40" y="45" class="title">Hand states in mission.py</text>
  <text x="40" y="63" class="subtitle">hover, descend, close, lift, carry, lower, settle, open, retreat</text>

  <!-- ROW 1: Stages 1 to 3 -->
  <!-- Stage 1 -->
  <rect x="30" y="100" width="300" height="130" class="box stage-card" />
  <text x="45" y="122" class="stage-num">STAGE 01</text>
  <text x="45" y="142" class="stage-title">Hover over the ring</text>
  <text x="45" y="162" class="stage-desc">Encoder prior plus 5x5 wrist rays.</text>
  <text x="45" y="178" class="stage-desc">Target held at local x = -0.08 m if still upstream.</text>
  <text x="45" y="198" class="stage-metric">HOVER_Z = GRASP_Z + 0.085 m</text>
  <text x="45" y="214" class="stage-metric">Advance: err &lt; 35 mm, tool-down &gt; 0.88</text>

  <!-- Flow 1->2 -->
  <path d="M 330 165 L 380 165" class="connector" />

  <!-- Stage 2 -->
  <rect x="385" y="100" width="300" height="130" class="box stage-card" />
  <text x="400" y="122" class="stage-num">STAGE 02</text>
  <text x="400" y="142" class="stage-title">Descend to GRASP_Z</text>
  <text x="400" y="162" class="stage-desc">Track GRASP_Z on the moving ring.</text>
  <text x="400" y="178" class="stage-desc">Climb back to HOVER_Z if the hand is 50 mm low.</text>
  <text x="400" y="198" class="stage-metric">Advance: err &lt; 30 mm, tool-down &gt; 0.92</text>
  <text x="400" y="214" class="stage-metric">Hand z within 30 mm of GRASP_Z. Timeout 6.5 s</text>

  <!-- Flow 2->3 -->
  <path d="M 685 165 L 735 165" class="connector" />

  <!-- Stage 3 -->
  <rect x="740" y="100" width="300" height="130" class="box stage-critical" />
  <text x="755" y="122" class="stage-num" fill="#16a34a">STAGE 03 [CRITICAL]</text>
  <text x="755" y="142" class="stage-title">Grasp Ring &amp; Equality Weld</text>
  <text x="755" y="162" class="stage-desc">Close after 0.30 s, gap &lt; 0.12 m, tool-down &gt; 0.90.</text>
  <text x="755" y="178" class="stage-desc">Weld if closest ring &lt; 16 mm and gap &lt; 0.11 m.</text>
  <text x="755" y="198" class="stage-metric" fill="#16a34a">eq_data stores the pose at engage</text>
  <text x="755" y="214" class="stage-metric" fill="#16a34a">Logged grasp distances: -9.4 mm to +2.4 mm</text>

  <!-- Flow 3->4 (Row 1 down to Row 2) -->
  <path d="M 890 230 L 890 270 L 180 270 L 180 300" class="connector" />

  <!-- ROW 2: Stages 4 to 6 -->
  <!-- Stage 4 -->
  <rect x="30" y="300" width="300" height="130" class="box stage-card" />
  <text x="45" y="322" class="stage-num">STAGE 04</text>
  <text x="45" y="342" class="stage-title">Vertical Lift Clear</text>
  <text x="45" y="362" class="stage-desc">Straight up to 0.968 m. XY stays at the grasp.</text>
  <text x="45" y="378" class="stage-desc">Advance when the ring is 30 mm above its rest height.</text>
  <text x="45" y="398" class="stage-metric">err &lt; 55 mm and tool-down &gt; 0.88</text>
  <text x="45" y="414" class="stage-metric">Timeout 4.5 s</text>

  <!-- Flow 4->5 -->
  <path d="M 330 365 L 380 365" class="connector" />

  <!-- Stage 5 -->
  <rect x="385" y="300" width="300" height="130" class="box stage-card" />
  <text x="400" y="322" class="stage-num">STAGE 05</text>
  <text x="400" y="342" class="stage-title">Carry: wait column</text>
  <text x="400" y="362" class="stage-desc">Fixed column, 80 ms lead, plant bottle position.</text>
  <text x="400" y="378" class="stage-desc">Joint min-jerk tracks the IK solution.</text>
  <text x="400" y="398" class="stage-metric">Go at local x &gt;= -0.08 m (A) or -0.084 m (B)</text>
  <text x="400" y="414" class="stage-metric">radial &lt; 28 mm, ring z &gt;= 0.93 m</text>

  <!-- Flow 5->6 -->
  <path d="M 685 365 L 735 365" class="connector" />

  <!-- Stage 6 -->
  <rect x="740" y="300" width="300" height="130" class="box stage-card" />
  <text x="755" y="322" class="stage-num">STAGE 06</text>
  <text x="755" y="342" class="stage-title">Lower onto the flange</text>
  <text x="755" y="362" class="stage-desc">60 ms lead. Trim gain 0.05 at A, 0.08 at B.</text>
  <text x="755" y="378" class="stage-desc">Bottle position comes from Carrier.arrival_t.</text>
  <text x="755" y="398" class="stage-metric">Uses ring xpos and Carrier.arrival_t</text>
  <text x="755" y="414" class="stage-metric">radial &lt; 10 mm, z 128-145 mm, ring-up &gt; 0.90</text>

  <!-- Flow 6->7 (Row 2 down to Row 3) -->
  <path d="M 890 430 L 890 460 L 180 460 L 180 480" class="connector" />

  <!-- ROW 3: Stages 7 to 9 -->
  <!-- Stage 7 -->
  <rect x="30" y="480" width="300" height="120" class="box stage-card" />
  <text x="45" y="500" class="stage-num">STAGE 07</text>
  <text x="45" y="518" class="stage-title">Settle</text>
  <text x="45" y="536" class="stage-desc">Settle gates, then open.</text>
  <text x="45" y="552" class="stage-metric">After 0.10 s: radial &lt; 3.6 mm, ring-up &gt; 0.94</text>
  <text x="45" y="568" class="stage-metric">After 1.20 s the state opens anyway</text>

  <!-- Flow 7->8 -->
  <path d="M 330 540 L 380 540" class="connector" />

  <!-- Stage 8 -->
  <rect x="385" y="480" width="300" height="120" class="box stage-critical" />
  <text x="400" y="500" class="stage-num" fill="#16a34a">STAGE 08 [CRITICAL SEATING]</text>
  <text x="400" y="518" class="stage-title">Shoulder Settle &amp; Open Release</text>
  <text x="400" y="536" class="stage-desc">Jaws open while the weld still holds the ring.</text>
  <text x="400" y="552" class="stage-metric" fill="#16a34a">Release: gap &gt; 0.090 m and radial &lt; 2.2 mm</text>
  <text x="400" y="568" class="stage-metric" fill="#16a34a">Seat tilt on the committed logs: up to 0.054 rad</text>

  <!-- Flow 8->9 -->
  <path d="M 685 540 L 735 540" class="connector" />

  <!-- Stage 9 -->
  <rect x="740" y="480" width="300" height="120" class="box stage-card" />
  <text x="755" y="500" class="stage-num">STAGE 09</text>
  <text x="755" y="518" class="stage-title">Vertical Clean Retreat</text>
  <text x="755" y="536" class="stage-desc">Climb to 1.005 m at 0.45 m/s.</text>
  <text x="755" y="552" class="stage-metric">ASSEMBLY_DONE after 0.05 s</text>
  <text x="755" y="568" class="stage-metric">Accepted count is written by the plant</text>
</svg>
